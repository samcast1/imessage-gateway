services:
  gateway:
    build: .
    container_name: imessage-gateway
    restart: unless-stopped
    environment:
      - WHOOP_API=http://whoop-api:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
    ports:
      - "100.78.146.104:8000:8000"
    networks:
      - automation

networks:
  automation:
    external: true